<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>UTM Tracker & Saved Path</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px;
      max-width: 500px;
      margin: auto;
      background: #0f172a;
      color: #f8fafc;
    }
    h2 { margin: 0 0 12px; font-size: 1.25rem; display: flex; justify-content: space-between; align-items: center; }
    .badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 99px; background: #1e293b; color: #94a3b8; }
    .badge.saved { background: #065f46; color: #6ee7b7; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .card { background: #1e293b; padding: 14px; border-radius: 10px; border: 1px solid #334155; }
    .card.full { grid-column: span 2; }
    
    .label { font-size: 0.72rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
    .val { font-size: 1.35rem; font-weight: 700; font-family: ui-monospace, monospace; margin-top: 4px; color: #38bdf8; }
    .val.green { color: #4ade80; }
    .val.amber { color: #fbbf24; }
    .sub { font-size: 0.8rem; color: #cbd5e1; font-family: ui-monospace, monospace; margin-top: 6px; }

    /* Compass UI */
    .compass-wrap { display: flex; align-items: center; justify-content: space-between; }
    .dial {
      width: 74px; height: 74px; border-radius: 50%; border: 2px solid #475569;
      position: relative; display: flex; align-items: center; justify-content: center;
      background: #0f172a;
    }
    .needle {
      width: 4px; height: 58px; position: relative; transition: transform 0.1s ease-out;
    }
    .needle::before {
      content: ""; position: absolute; top: 0; left: -3px;
      border-left: 5px solid transparent; border-right: 5px solid transparent; border-bottom: 29px solid #ef4444;
    }
    .needle::after {
      content: ""; position: absolute; bottom: 0; left: -3px;
      border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 29px solid #94a3b8;
    }

    /* Track Path Canvas */
    canvas {
      width: 100%;
      height: 260px;
      background: #0b1120;
      border-radius: 8px;
      border: 1px solid #334155;
      margin-top: 8px;
      display: block;
    }

    /* Controls */
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button {
      padding: 12px; font-size: 0.92rem; font-weight: 600; border: none;
      border-radius: 8px; cursor: pointer; color: #fff; background: #2563eb;
      touch-action: manipulation;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.stop { background: #dc2626; }
    button.secondary { background: #334155; }
    button.export { background: #059669; }
    #status { margin-top: 8px; font-size: 0.85rem; color: #fbbf24; min-height: 1.4em; word-break: break-word; }
  </style>
</head>
<body>

  <h2>
    <span>UTM & Saved Path</span>
    <span id="ptBadge" class="badge">0 pts saved</span>
  </h2>

  <div class="btn-row">
    <button type="button" id="toggleBtn" style="grid-column: span 2;">Start Tracking</button>
    <button type="button" id="resetBtn" class="secondary">Clear & Reset</button>
    <button type="button" id="exportBtn" class="export" disabled>Download CSV</button>
  </div>
  <div id="status">Tap Start to enable GPS and Compass.</div>

  <div class="grid">
    <!-- Live UTM -->
    <div class="card full">
      <div class="label">UTM Coordinates (<span id="zone">--</span>)</div>
      <div class="val green" id="utmE">E: --</div>
      <div class="val green" id="utmN">N: --</div>
      <div class="sub" id="meta">Accuracy: -- | Lat/Lng: --</div>
    </div>

    <!-- Distance to Start -->
    <div class="card">
      <div class="label">Distance to Start</div>
      <div class="val amber" id="distStart">0.0 m</div>
      <div class="sub" id="bearingStart">Return: --°</div>
    </div>

    <!-- Azimuth Compass -->
    <div class="card compass-wrap">
      <div>
        <div class="label">Azimuth</div>
        <div class="val" id="azimuthVal">--°</div>
        <div class="sub" id="cardinalDir">--</div>
      </div>
      <div class="dial">
        <div class="needle" id="needle"></div>
      </div>
    </div>

    <!-- Track Path Graph -->
    <div class="card full">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="label">Track Path (North Up)</span>
        <span class="sub" id="scaleLabel" style="margin:0;">View: ~10m</span>
      </div>
      <canvas id="trackCanvas" width="460" height="260"></canvas>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "utm_saved_track_v1";

    let watchId = null;
    let currentFix = null;
    let originUTM = null;
    let currentAzimuth = null;
    let trackPoints = []; // Array of { x, y, easting, northing, lat, lng, time }

    const toggleBtn = document.getElementById("toggleBtn");
    const resetBtn = document.getElementById("resetBtn");
    const exportBtn = document.getElementById("exportBtn");
    const statusEl = document.getElementById("status");
    const ptBadge = document.getElementById("ptBadge");
    const canvas = document.getElementById("trackCanvas");
    const ctx = canvas.getContext("2d");

    if (!window.isSecureContext) {
      statusEl.textContent = "Warning: GPS & Compass require HTTPS (or localhost).";
    }

    // 1. LocalStorage Persistence
    function saveTrackToStorage() {
      try {
        const payload = { originUTM, trackPoints };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        updateBadge();
      } catch (e) {
        console.warn("Storage full or unavailable:", e);
      }
    }

    function loadTrackFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed && parsed.originUTM && Array.isArray(parsed.trackPoints)) {
          originUTM = parsed.originUTM;
          trackPoints = parsed.trackPoints;
          updateBadge();
          if (trackPoints.length > 0) {
            const last = trackPoints[trackPoints.length - 1];
            const dist = Math.hypot(last.x, last.y);
            document.getElementById("distStart").textContent = `${dist.toFixed(1)} m`;
            statusEl.textContent = `Restored ${trackPoints.length} saved points from device.`;
          }
        }
      } catch (e) {
        console.warn("Failed to parse saved track:", e);
      }
    }

    function updateBadge() {
      const count = trackPoints.length;
      ptBadge.textContent = `${count} pt${count === 1 ? "" : "s"} saved`;
      ptBadge.classList.toggle("saved", count > 0);
      exportBtn.disabled = count === 0;
    }

    // 2. WGS84 Lat/Lng to UTM
    function latLngToUTM(lat, lng) {
      if (lat < -80 || lat > 84) throw new Error("Out of UTM bounds");
      const a = 6378137.0, f = 1 / 298.257223563, k0 = 0.9996;
      const e2 = 2 * f - f * f, ep2 = e2 / (1 - e2);

      let zone = Math.floor((lng + 180) / 6) + 1;
      if (lat >= 56.0 && lat < 64.0 && lng >= 3.0 && lng < 12.0) zone = 32;
      if (lat >= 72.0 && lat < 84.0) {
        if (lng >= 0.0 && lng < 9.0) zone = 31;
        else if (lng >= 9.0 && lng < 21.0) zone = 33;
        else if (lng >= 21.0 && lng < 33.0) zone = 35;
        else if (lng >= 33.0 && lng < 42.0) zone = 37;
      }

      const lonOriginRad = ((zone - 1) * 6 - 180 + 3) * (Math.PI / 180);
      const latRad = lat * (Math.PI / 180);
      const lonRad = lng * (Math.PI / 180);
      const bands = "CDEFGHJKLMNPQRSTUVWXX";
      const band = bands[Math.floor((lat + 80) / 8)];

      const N = a / Math.sqrt(1 - e2 * Math.sin(latRad) ** 2);
      const T = Math.tan(latRad) ** 2;
      const C = ep2 * Math.cos(latRad) ** 2;
      const A = Math.cos(latRad) * (lonRad - lonOriginRad);

      const M = a * (
        (1 - e2 / 4 - (3 * e2 ** 2) / 64 - (5 * e2 ** 3) / 256) * latRad -
        ((3 * e2) / 8 + (3 * e2 ** 2) / 32 + (45 * e2 ** 3) / 1024) * Math.sin(2 * latRad) +
        ((15 * e2 ** 2) / 256 + (45 * e2 ** 3) / 1024) * Math.sin(4 * latRad) -
        ((35 * e2 ** 3) / 3072) * Math.sin(6 * latRad)
      );

      const easting = k0 * N * (
        A + ((1 - T + C) * A ** 3) / 6 +
        ((5 - 18 * T + T ** 2 + 72 * C - 58 * ep2) * A ** 5) / 120
      ) + 500000.0;

      let northing = k0 * (
        M + N * Math.tan(latRad) * (
          A ** 2 / 2 + ((5 - T + 9 * C + 4 * C ** 2) * A ** 4) / 24 +
          ((61 - 58 * T + T ** 2 + 600 * C - 330 * ep2) * A ** 6) / 720
        )
      );
      if (lat < 0) northing += 10000000.0;

      return { zone: `${zone}${band}`, easting, northing };
    }

    // 3. Azimuth Compass
    function degToCardinal(deg) {
      const dirs = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
      return dirs[Math.round(deg / 45) % 8];
    }

    function handleOrientation(event) {
      let heading = null;
      if (typeof event.webkitCompassHeading === "number") {
        heading = event.webkitCompassHeading;
      } else if (event.absolute && typeof event.alpha === "number") {
        heading = (360 - event.alpha) % 360;
      } else if (typeof event.alpha === "number") {
        heading = (360 - event.alpha) % 360;
      }

      if (heading !== null && !isNaN(heading)) {
        currentAzimuth = Math.round(heading);
        document.getElementById("azimuthVal").textContent = `${currentAzimuth}°`;
        document.getElementById("cardinalDir").textContent = degToCardinal(currentAzimuth);
        document.getElementById("needle").style.transform = `rotate(${-currentAzimuth}deg)`;
        drawTrackGraph();
      }
    }

    function initCompass() {
